<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频文稿提取器</title>
<style>
  :root{
    --bg:#fff; --line:#e5e6eb; --text:#1d2129; --sub:#86909c;
    --accent:#165dff; --accent-soft:#e8f3ff; --ok:#00b42a; --err:#f53f3f; --warn:#ff7d00;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{
    width:352px;max-width:100vw; margin:0; padding:14px 16px 16px; background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    font-size:13px; line-height:1.6;
  }
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .logo{font-size:14.5px;font-weight:700;letter-spacing:.3px;}
  .link{
    background:none;border:none;color:var(--sub);font:inherit;font-size:12.5px;
    cursor:pointer;padding:2px 4px;border-radius:4px;
  }
  .link:hover{color:var(--accent);background:var(--accent-soft);}
  .video{
    background:#fafbfc;border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;margin-bottom:13px;
  }
  .vtitle{font-weight:600;font-size:13px;line-height:1.5;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .vmeta{font-size:11.5px;color:var(--sub);}
  .vmeta .warn{color:var(--warn);}
  .vmeta .err{color:var(--err);}
  label.chk{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4e5969;
    cursor:pointer;user-select:none;padding:4px 0;
  }
  input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;margin:0;}
  .opts{margin-bottom:13px;}
  .btns{display:flex;flex-direction:column;gap:9px;}
  button.primary{
    width:100%;border:none;border-radius:8px;padding:11px;font:inherit;font-size:13.5px;
    font-weight:600;background:var(--accent);color:#fff;cursor:pointer;transition:.15s;
  }
  button.primary:hover{opacity:.9;}
  button.primary:disabled{background:#c9cdd4;cursor:not-allowed;}
  button.secondary{
    width:100%;border:1px solid var(--accent);border-radius:8px;padding:10px;font:inherit;
    font-size:13.5px;font-weight:600;background:#fff;color:var(--accent);cursor:pointer;transition:.15s;
  }
  button.secondary:hover{background:var(--accent-soft);}
  button.secondary:disabled{border-color:#c9cdd4;color:#c9cdd4;background:#fff;cursor:not-allowed;}
  .status{margin-top:10px;font-size:11.5px;color:var(--sub);min-height:16px;line-height:1.5;}
  .status.err{color:var(--err);}
  .status.ok{color:var(--ok);}
  .spinner{
    display:inline-block;width:11px;height:11px;border:2px solid #fff;
    border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-1px;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
    font-size:11px;color:var(--sub);line-height:1.6;}
  .hint b{color:var(--text);font-weight:600;}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  button:disabled{cursor:not-allowed;opacity:.65;}
  .doc{overflow-wrap:anywhere;}
  @media(max-width:600px){header{padding:14px 16px;}nav.tabs{padding:0 8px;}main{padding:14px 12px;} .doc{padding:18px 16px;}footer{padding:12px 14px;}.meta{gap:8px;} .save-row input[type=text]{min-width:100px;}}
</style>
</head>
<body>
  <div class="head">
    <span class="logo">视频文稿提取器</span>
    <button class="link" id="openOpts">设置</button>
  </div>

  <div class="video">
    <div class="vtitle" id="vtitle">正在识别当前页面…</div>
    <div class="vmeta" id="vmeta"></div>
  </div>

  <div class="opts">
    <label class="chk"><input type="checkbox" id="allP"> 抓取全部分P（合集视频）</label>
    <label class="chk"><input type="checkbox" id="withTs"> 保留时间戳</label>
      <label class="chk"><input type="checkbox" id="translateCn"> 翻译成中文</label>
  </div>

  <div class="btns">
    <button class="primary" id="runAi" disabled>提取并生成 AI 总结</button>
    <button class="secondary" id="runTranscript" disabled>提取精简文稿</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script src="lib/core.js"></script>
<script src="popup.js"></script>
</body>
</html>
